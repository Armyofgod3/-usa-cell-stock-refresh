name: MobileSentrix catalog worker

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      run_worker:
        description: "Run the approved private crawl until done or held (manual only)"
        type: boolean
        required: true
        default: false
      run_scheduled_refresh:
        description: "Run one signed scheduled-refresh tick sequence (only if the Admin schedule is enabled and due)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mobilesentrix-full-catalog
  cancel-in-progress: false

jobs:
  validate-caller:
    name: Test caller without production access
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out isolated worker repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Test bounded signed caller
        run: node --test tests/mobilesentrix-worker-caller.test.mjs tests/workflow-safety.test.mjs

  execute-worker:
    name: Run production worker only when due or explicitly selected
    if: >-
      ${{
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (
          github.event_name == 'schedule' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.run_worker != inputs.run_scheduled_refresh &&
            (inputs.run_worker || inputs.run_scheduled_refresh)
          )
        )
      }}
    needs: validate-caller
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: mobilesentrix-production
    steps:
      - name: Check out isolated worker repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Advance manually approved import
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_worker == true }}
        env:
          USA_CELL_WORKER_API_URL: ${{ vars.USA_CELL_WORKER_API_URL }}
          MOBILESENTRIX_WORKER_TRIGGER_SECRET: ${{ secrets.MOBILESENTRIX_WORKER_TRIGGER_SECRET }}
        run: node scripts/mobilesentrix-worker-caller.mjs

      - name: Advance due retained refresh
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_scheduled_refresh == true) }}
        env:
          USA_CELL_SCHEDULED_REFRESH_API_URL: ${{ vars.USA_CELL_SCHEDULED_REFRESH_API_URL }}
          MOBILESENTRIX_SCHEDULED_REFRESH_TRIGGER_SECRET: ${{ secrets.MOBILESENTRIX_SCHEDULED_REFRESH_TRIGGER_SECRET }}
        run: node scripts/mobilesentrix-worker-caller.mjs --scheduled-refresh
